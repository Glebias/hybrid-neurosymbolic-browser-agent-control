[project]
name = "browser-guard"
version = "0.1.0"
description = "Hybrid neurosymbolic action guard for Browser Use"
requires-python = ">=3.12"
dependencies = ["browser-use==0.13.14", "fastapi", "uvicorn", "httpx", "python-dotenv"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "playwright", "imageio-ffmpeg", "pypdf"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["guard*"]
